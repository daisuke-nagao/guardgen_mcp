name: CD

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true
          rustflags: ""

      - name: Install cargo-about
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-about@0.9.2
          fallback: none

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Generate third-party licenses
        run: >-
          cargo about generate --locked --fail
          --target ${{ matrix.target }}
          --output-file "target/${{ matrix.target }}/release/THIRD-PARTY-LICENSES.html"
          about.hbs

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release_dir="target/${TARGET}/release"
          binary="${release_dir}/guardgen_mcp"
          report="${release_dir}/THIRD-PARTY-LICENSES.html"
          for file in "$binary" "$report" LICENSE-MIT LICENSE-APACHE; do
            test -s "$file"
          done
          cp LICENSE-MIT LICENSE-APACHE "$release_dir"
          archive="guardgen_mcp-${TARGET}.tar.gz"
          tar -czf "$archive" -C "$release_dir" "$(basename "$binary")" THIRD-PARTY-LICENSES.html LICENSE-MIT LICENSE-APACHE
          test -s "$archive"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $release_dir = "target/$env:TARGET/release"
          $binary = "$release_dir/guardgen_mcp.exe"
          $report = "$release_dir/THIRD-PARTY-LICENSES.html"
          $source_licenses = @("LICENSE-MIT", "LICENSE-APACHE")
          $required_files = @($binary, $report) + $source_licenses
          foreach ($file in $required_files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "missing release file: $file" }
            if ((Get-Item -LiteralPath $file).Length -eq 0) { throw "empty release file: $file" }
          }
          Copy-Item -LiteralPath $source_licenses -Destination $release_dir
          $archive_files = @(
            "$release_dir/guardgen_mcp.exe"
            "$release_dir/THIRD-PARTY-LICENSES.html"
            "$release_dir/LICENSE-MIT"
            "$release_dir/LICENSE-APACHE"
          )
          $archive = "guardgen_mcp-$env:TARGET.zip"
          Compress-Archive -LiteralPath $archive_files -DestinationPath $archive
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "missing archive: $archive" }
          if ((Get-Item -LiteralPath $archive).Length -eq 0) { throw "empty archive: $archive" }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guardgen_mcp-${{ matrix.target }}
          path: guardgen_mcp-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guardgen_mcp-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(find dist -type f | wc -l)" -eq 3
          gh release create "$TAG" --verify-tag --generate-notes dist/*
