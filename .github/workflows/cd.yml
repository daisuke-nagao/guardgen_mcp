name: CD

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true
          rustflags: ""

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/guardgen_mcp"
          test -f "$binary"
          archive="guardgen_mcp-${TARGET}.tar.gz"
          tar -czf "$archive" -C "$(dirname "$binary")" "$(basename "$binary")"
          test -f "$archive"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $binary = "target/$env:TARGET/release/guardgen_mcp.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "missing release binary: $binary" }
          $archive = "guardgen_mcp-$env:TARGET.zip"
          Compress-Archive -LiteralPath $binary -DestinationPath $archive
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "missing archive: $archive" }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guardgen_mcp-${{ matrix.target }}
          path: guardgen_mcp-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guardgen_mcp-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(find dist -type f | wc -l)" -eq 3
          gh release create "$TAG" --verify-tag --generate-notes dist/*
